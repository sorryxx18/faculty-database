<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>消防師資戰力回饋管理系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f1f5f9; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .instructor-card:hover { transform: translateY(-2px); transition: 0.2s; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <!-- 側邊選單 -->
    <aside class="w-64 bg-slate-900 text-white flex flex-col">
        <div class="p-6 border-b border-slate-800">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <i class="ri-fire-fill text-orange-500"></i> 師資戰力管理
            </h1>
        </div>
        <nav class="flex-1 p-4 space-y-2">
            <button onclick="switchTab('db')" class="w-full flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-slate-800 transition active" id="btn-db">
                <i class="ri-database-2-line"></i> 教官資料庫
            </button>
            <button onclick="switchTab('schedule')" class="w-full flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-slate-800 transition" id="btn-schedule">
                <i class="ri-calendar-event-line"></i> 課表報名/審核
            </button>
            <button onclick="switchTab('import')" class="w-full flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-slate-800 transition" id="btn-import">
                <i class="ri-rest-time-line"></i> CSV時數逆推
            </button>
        </nav>
    </aside>

    <!-- 主內容區 -->
    <main class="flex-1 flex flex-col overflow-hidden">
        
        <!-- 頁面：教官資料庫 -->
        <section id="tab-db" class="tab-content active p-8 overflow-y-auto h-full">
            <div class="flex justify-between items-end mb-6">
                <div>
                    <h2 class="text-2xl font-bold text-slate-800">教官師資庫</h2>
                    <p class="text-slate-500">追蹤累計時數與專業資歷</p>
                </div>
                <button class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-bold shadow-lg" onclick="showAddInstructor()">+ 新增師資</button>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="instructorGrid">
                <!-- 教官名片將由 JS 產出 -->
            </div>
        </section>

        <!-- 頁面：課表報名與排序審核 -->
        <section id="tab-schedule" class="tab-content p-8 overflow-y-auto h-full">
            <h2 class="text-2xl font-bold text-slate-800 mb-2">未來課表報名</h2>
            <p class="text-slate-500 mb-6">發佈課表並依「資歷與公平性」進行排序審核</p>
            
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                <table class="w-full text-left">
                    <thead class="bg-slate-50 border-b border-slate-200">
                        <tr>
                            <th class="p-4">課程日期/名稱</th>
                            <th class="p-4">需求人數</th>
                            <th class="p-4">報名狀況</th>
                            <th class="p-4">操作</th>
                        </tr>
                    </thead>
                    <tbody id="scheduleBody">
                        <!-- 範例課程 -->
                        <tr>
                            <td class="p-4">
                                <div class="font-bold">114/11/15 救助師資複訓</div>
                                <div class="text-xs text-slate-400">地點：保長坑訓練場</div>
                            </td>
                            <td class="p-4">
                                <span class="text-sm">教官 1 / 助教 2</span>
                            </td>
                            <td class="p-4">
                                <div class="flex -space-x-2">
                                    <div class="w-8 h-8 rounded-full bg-orange-500 border-2 border-white flex items-center justify-center text-[10px] text-white">資</div>
                                    <div class="w-8 h-8 rounded-full bg-blue-500 border-2 border-white flex items-center justify-center text-[10px] text-white">公</div>
                                </div>
                            </td>
                            <td class="p-4">
                                <button class="text-blue-600 font-bold text-sm" onclick="showAuditModal()">進入排序審核</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <!-- 頁面：CSV時數逆推 -->
        <section id="tab-import" class="tab-content p-8 overflow-y-auto h-full">
            <div class="max-w-2xl bg-white p-8 rounded-2xl shadow-sm border border-slate-200 mx-auto mt-10">
                <div class="text-center mb-8">
                    <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl">
                        <i class="ri-file-excel-2-line"></i>
                    </div>
                    <h2 class="text-2xl font-bold text-slate-800">匯入官方領據 CSV</h2>
                    <p class="text-slate-500">透過金額自動逆推並累積教官時數</p>
                </div>
                
                <div class="space-y-6">
                    <div class="p-4 bg-slate-50 rounded-lg border border-dashed border-slate-300">
                        <input type="file" id="csvFile" accept=".csv" class="w-full text-sm">
                    </div>
                    
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-500 mb-1">教官費率 (元/時)</label>
                            <input type="number" id="rateLead" value="1000" class="w-full border rounded p-2 text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-500 mb-1">助教費率 (元/時)</label>
                            <input type="number" id="rateAsst" value="500" class="w-full border rounded p-2 text-sm">
                        </div>
                    </div>

                    <button onclick="processCSV()" class="w-full bg-slate-800 text-white py-3 rounded-xl font-bold hover:bg-slate-700 transition">
                        執行逆推並更新時數
                    </button>
                </div>

                <div id="importResult" class="mt-6 hidden p-4 bg-emerald-50 text-emerald-700 rounded-lg text-sm">
                    <!-- 顯示處理結果 -->
                </div>
            </div>
        </section>
    </main>

    <!-- 排序審核彈窗 (模擬資歷與公平排序) -->
    <div id="auditModal" class="fixed inset-0 bg-black/60 hidden items-center justify-center z-50">
        <div class="bg-white w-[600px] rounded-2xl p-6 shadow-2xl">
            <h3 class="text-xl font-bold mb-4">課程報名排序 (先資歷後公平)</h3>
            <div class="space-y-3 mb-6">
                <!-- 排序結果 -->
                <div class="flex items-center justify-between p-3 border rounded-xl bg-blue-50 border-blue-200">
                    <div class="flex items-center gap-3">
                        <span class="w-6 h-6 bg-blue-600 text-white text-xs flex items-center justify-center rounded-full font-bold">1</span>
                        <div>
                            <div class="font-bold">林政憲 <span class="text-xs bg-blue-100 text-blue-700 px-1 rounded">資深</span></div>
                            <div class="text-[10px] text-slate-500">累計教官: 120hr | 今年已領: 4hr</div>
                        </div>
                    </div>
                    <button class="bg-blue-600 text-white px-3 py-1 rounded text-xs">核准教官</button>
                </div>
                <div class="flex items-center justify-between p-3 border rounded-xl bg-slate-50">
                    <div class="flex items-center gap-3">
                        <span class="w-6 h-6 bg-slate-400 text-white text-xs flex items-center justify-center rounded-full font-bold">2</span>
                        <div>
                            <div class="font-bold">張浩哲 <span class="text-xs bg-slate-200 text-slate-600 px-1 rounded">中堅</span></div>
                            <div class="text-[10px] text-slate-500">累計教官: 45hr | 今年已領: 2hr</div>
                        </div>
                    </div>
                    <button class="border border-slate-300 px-3 py-1 rounded text-xs">核准助教</button>
                </div>
            </div>
            <div class="flex justify-end">
                <button onclick="hideAuditModal()" class="text-slate-400 font-bold">關閉</button>
            </div>
        </div>
    </div>

    <script>
        // 核心資料庫 (實際應存於 Google Sheets)
        let instructors = [
            { id: "P122355534", name: "林政憲", unit: "石牌分隊", startYear: 105, leadHours: 120, asstHours: 60, currentYearHours: 4 },
            { id: "A127854094", name: "張浩哲", unit: "大直分隊", startYear: 110, leadHours: 45, asstHours: 80, currentYearHours: 2 }
        ];

        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('bg-slate-800', 'text-white'));
            
            document.getElementById('tab-' + tab).classList.add('active');
            document.getElementById('btn-' + tab).classList.add('bg-slate-800', 'text-white');
        }

        function renderInstructors() {
            const grid = document.getElementById('instructorGrid');
            grid.innerHTML = instructors.map(ins => `
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 instructor-card">
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <h3 class="text-lg font-bold text-slate-800">${ins.name}</h3>
                            <p class="text-xs text-slate-400">${ins.unit} | 年資: ${114 - ins.startYear}年</p>
                        </div>
                        <div class="bg-orange-100 text-orange-600 px-2 py-1 rounded text-[10px] font-bold">ID: ${ins.id.slice(0,4)}***</div>
                    </div>
                    <div class="grid grid-cols-2 gap-4 border-t pt-4">
                        <div class="text-center">
                            <div class="text-2xl font-bold text-blue-600">${ins.leadHours}</div>
                            <div class="text-[10px] text-slate-400 uppercase tracking-wider">教官累計時數</div>
                        </div>
                        <div class="text-center border-l">
                            <div class="text-2xl font-bold text-emerald-500">${ins.asstHours}</div>
                            <div class="text-[10px] text-slate-400 uppercase tracking-wider">助教累計時數</div>
                        </div>
                    </div>
                    <div class="mt-4 bg-slate-50 p-2 rounded-lg flex justify-between items-center">
                        <span class="text-[10px] font-bold text-slate-400">今年度回饋公平分:</span>
                        <span class="text-xs font-bold text-slate-700">${ins.currentYearHours} 小時</span>
                    </div>
                </div>
            `).join('');
        }

        // CSV 逆推邏輯
        function processCSV() {
            const file = document.getElementById('csvFile').files[0];
            const rateL = document.getElementById('rateLead').value;
            const rateA = document.getElementById('rateAsst').value;
            
            if (!file) return alert("請先選擇 CSV 檔案");

            Papa.parse(file, {
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    let updatedCount = 0;
                    results.data.forEach(row => {
                        // 1. 抓取身分證字號與金額
                        const id = row["身分證字號"]?.trim();
                        const amount = parseFloat(row["鐘點費(A)"] || 0);
                        const instructor = instructors.find(ins => ins.id === id);

                        if (instructor && amount > 0) {
                            // 2. 逆推時數 (優先嘗試以教官費率逆推)
                            // 實務上應搭配 CSV 的「備註」判斷教/助位子
                            let hours = amount / rateL; 
                            instructor.leadHours += hours;
                            instructor.currentYearHours += hours;
                            updatedCount++;
                        }
                    });
                    
                    document.getElementById('importResult').classList.remove('hidden');
                    document.getElementById('importResult').innerText = `成功逆推並更新 ${updatedCount} 位教官的時數資料！`;
                    renderInstructors();
                }
            });
        }

        function showAuditModal() { document.getElementById('auditModal').classList.replace('hidden', 'flex'); }
        function hideAuditModal() { document.getElementById('auditModal').classList.replace('flex', 'hidden'); }

        renderInstructors();
    </script>
</body>
</html>
