<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>消防局師資戰力回饋與報名審核系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f8fafc; }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .nav-btn.active { background: #f97316; color: white; box-shadow: 0 4px 12px rgba(249, 115, 22, 0.3); }
        .instructor-card:hover { transform: translateY(-5px); transition: 0.3s; border-bottom: 4px solid #f97316; }
        .modal { display: none; align-items: center; justify-content: center; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.8); z-index: 100; backdrop-filter: blur(4px); }
        .modal.active { display: flex; }
    </style>
</head>
<body class="flex h-screen overflow-hidden text-slate-700">

    <!-- 側邊選單 -->
    <aside class="w-64 bg-slate-900 text-white flex flex-col shadow-2xl shrink-0">
        <div class="p-6 border-b border-slate-800">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-orange-500 rounded-lg flex items-center justify-center shadow-lg shadow-orange-500/30">
                    <i class="ri-fire-fill text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold tracking-wider">師資戰力</h1>
                    <p class="text-[10px] text-slate-400 uppercase tracking-widest">Instructor Portal</p>
                </div>
            </div>
        </div>
        
        <nav class="flex-1 p-4 mt-4 space-y-1">
            <button onclick="switchTab('db')" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl transition active" id="btn-db">
                <i class="ri-user-star-line text-lg"></i> 教官師資庫
            </button>
            <button onclick="switchTab('booking')" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-400 hover:text-white transition" id="btn-booking">
                <i class="ri-edit-box-line text-lg"></i> 教官自主報名
            </button>
            <button onclick="switchTab('audit')" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-400 hover:text-white transition" id="btn-audit">
                <i class="ri-check-double-line text-lg"></i> 排序審核發佈
            </button>
            <button onclick="switchTab('import')" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-400 hover:text-white transition" id="btn-import">
                <i class="ri-line-chart-line text-lg"></i> 領據逆推歸戶
            </button>
            <button onclick="switchTab('support')" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-400 hover:text-white transition" id="btn-support">
                <i class="ri-history-line text-lg"></i> 支援資歷統計
            </button>
        </nav>
        <div class="p-6 border-t border-slate-800 text-[10px] text-slate-500 text-center">Version 4.0 (Matrix Support)</div>
    </aside>

    <!-- 主內容區 -->
    <main class="flex-1 flex flex-col overflow-hidden">
        
        <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-8 shrink-0 z-10">
            <div id="pageTitle" class="font-bold text-slate-800 text-xl">教官師資庫</div>
            <div id="loadingStatus" class="text-xs text-orange-500 font-bold hidden">處理中...</div>
        </header>

        <!-- 頁面：師資庫 -->
        <section id="tab-db" class="tab-content active p-8 overflow-y-auto h-full">
            <div class="flex justify-between items-center mb-8 bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
                <div class="flex gap-3">
                    <button class="text-[10px] bg-slate-100 px-3 py-2 rounded-lg font-bold hover:bg-slate-200" onclick="downloadInsSample()">下載師資範本</button>
                    <button class="text-[10px] bg-blue-50 px-3 py-2 rounded-lg font-bold text-blue-600 hover:bg-blue-100" onclick="$('#fileIns').click()">批次匯入師資</button>
                    <input type="file" id="fileIns" class="hidden" accept=".csv" onchange="importIns(this)">
                </div>
                <button class="bg-slate-900 text-white px-5 py-2 rounded-xl text-sm font-bold shadow-lg hover:bg-orange-500" onclick="openModal('modalAddIns')">+ 新增師資</button>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6" id="insGrid"></div>
        </section>

        <!-- 頁面：教官自主報名 -->
        <section id="tab-booking" class="tab-content p-8 overflow-y-auto h-full text-center">
            <div class="max-w-2xl mx-auto bg-white p-10 rounded-3xl shadow-xl border border-slate-100">
                <div id="bookingLoginView">
                    <div class="w-20 h-20 bg-orange-100 text-orange-600 rounded-full flex items-center justify-center mx-auto mb-6 text-3xl"><i class="ri-user-follow-line"></i></div>
                    <h2 class="text-2xl font-bold mb-2">教官身分驗證</h2>
                    <p class="text-slate-400 text-sm mb-8">請輸入身分證字號進入報名大廳</p>
                    <input type="text" id="loginId" placeholder="請輸入身分證字號" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl text-center text-lg font-bold mb-4 outline-none focus:border-orange-500">
                    <button onclick="loginBooking()" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold text-lg hover:bg-orange-500 transition shadow-lg shadow-slate-900/20">進入報名系統</button>
                </div>
                
                <div id="bookingArea" class="hidden text-left">
                    <div class="flex justify-between items-center border-b pb-4 mb-6">
                        <h3 class="font-bold text-lg" id="welcomeMsg">歡迎教官</h3>
                        <button onclick="logoutBooking()" class="text-xs text-red-500 underline">登出</button>
                    </div>
                    <div id="bookingList" class="space-y-6">
                        <!-- 按日期分組的課表 -->
                    </div>
                </div>
            </div>
        </section>

        <!-- 頁面：排序審核 -->
        <section id="tab-audit" class="tab-content p-8 overflow-y-auto h-full">
            <div class="flex justify-between items-end mb-6">
                <div>
                    <h3 class="text-2xl font-bold">課表審核發佈</h3>
                    <p class="text-slate-500 text-sm">先資歷（證照月數） > 後公平（年度時數）</p>
                </div>
                <div class="flex gap-2">
                    <button class="text-[10px] bg-slate-100 px-3 py-2 rounded-lg font-bold" onclick="downloadCourseSample()">下載課表範本</button>
                    <button class="text-[10px] bg-blue-600 text-white px-3 py-2 rounded-lg font-bold shadow-lg" onclick="$('#fileCourse').click()">匯入課表CSV</button>
                    <input type="file" id="fileCourse" class="hidden" accept=".csv" onchange="importCourse(this)">
                </div>
            </div>
            <div id="auditCourseList" class="space-y-4">
                <!-- 審核清單 -->
            </div>
        </section>

        <!-- 頁面：時數逆推 -->
        <section id="tab-import" class="tab-content p-8 h-full">
            <div class="max-w-xl mx-auto mt-20 bg-white p-10 rounded-3xl shadow-xl border border-slate-100 text-center">
                <div class="w-20 h-20 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-6 text-4xl"><i class="ri-line-chart-line"></i></div>
                <h2 class="text-2xl font-bold mb-2">領據時數歸戶</h2>
                <p class="text-slate-400 text-sm mb-8">透過「鐘點費領據清冊」自動更新教官回饋帳戶</p>
                <div class="border-2 border-dashed border-slate-100 rounded-2xl p-10 text-center hover:border-blue-500 transition cursor-pointer" onclick="$('#filePayroll').click()">
                    <p class="text-slate-500" id="payrollName">上傳領據 CSV (含身分證與金額)</p>
                    <input type="file" id="filePayroll" class="hidden" accept=".csv" onchange="applyPayroll(this)">
                </div>
            </div>
        </section>

        <!-- 頁面：支援資歷 -->
        <section id="tab-support" class="tab-content p-8 overflow-y-auto h-full">
            <div class="flex justify-between items-end mb-6">
                <h3 class="text-2xl font-bold">支援資歷檔案 (大隊統計用)</h3>
                <button class="bg-slate-900 text-white px-4 py-2 rounded-xl text-sm font-bold" onclick="$('#fileSupport').click()">匯入紀錄</button>
                <input type="file" id="fileSupport" class="hidden" accept=".csv" onchange="importSupport(this)">
            </div>
            <div class="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">
                <table class="w-full text-left text-sm">
                    <thead class="bg-slate-50 border-b"><tr><th class="p-4">大隊別</th><th class="p-4">姓名</th><th class="p-4">類別</th><th class="p-4">支援期程</th><th class="p-4 text-center">月數</th></tr></thead>
                    <tbody id="supportTableBody"></tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- Modal: 新增教官 -->
    <div id="modalAddIns" class="modal">
        <div class="bg-white w-[500px] rounded-3xl p-8 shadow-2xl relative">
            <h3 class="text-xl font-bold mb-6 flex items-center gap-2"><i class="ri-user-add-fill text-orange-500"></i> 新增教官資料</h3>
            <div class="space-y-4">
                <div class="flex justify-center mb-4">
                    <div class="w-24 h-24 bg-slate-100 rounded-full border-2 border-dashed border-slate-300 flex items-center justify-center relative overflow-hidden group">
                        <img id="prevPhoto" class="hidden w-full h-full object-cover">
                        <i class="ri-camera-line text-2xl text-slate-300 group-hover:text-orange-500"></i>
                        <input type="file" id="inPhoto" class="absolute inset-0 opacity-0 cursor-pointer" onchange="preImg(this)">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <input type="text" id="inName" placeholder="姓名" class="w-full p-3 bg-slate-50 border rounded-xl outline-none focus:border-orange-500">
                    <input type="text" id="inId" placeholder="身分證字號" class="w-full p-3 bg-slate-50 border rounded-xl outline-none focus:border-orange-500">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <input type="text" id="inUnit" placeholder="單位" class="w-full p-3 bg-slate-50 border rounded-xl">
                    <input type="month" id="inCertDate" class="w-full p-3 bg-slate-50 border rounded-xl" title="取得師資證照年月">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <input type="number" id="inL" placeholder="教官時數" class="w-full p-3 bg-slate-50 border rounded-xl">
                    <input type="number" id="inA" placeholder="助教時數" class="w-full p-3 bg-slate-50 border rounded-xl">
                </div>
            </div>
            <div class="mt-8 flex gap-3">
                <button onclick="closeModal('modalAddIns')" class="flex-1 py-3 border rounded-xl text-slate-400">取消</button>
                <button onclick="saveIns()" class="flex-1 py-3 bg-orange-500 text-white rounded-xl font-bold shadow-lg">儲存並建立</button>
            </div>
        </div>
    </div>

    <!-- Modal: 審核列表 -->
    <div id="modalAudit" class="modal">
        <div class="bg-white w-[650px] rounded-3xl p-8 shadow-2xl flex flex-col max-h-[85vh]">
            <div class="flex justify-between items-center mb-6">
                <div><h3 class="text-xl font-bold" id="auditTitle">時段排序審核</h3><p class="text-xs text-orange-600 font-bold">先資歷 > 後公平</p></div>
                <button onclick="closeModal('modalAudit')" class="text-slate-300 hover:text-slate-800"><i class="ri-close-circle-fill text-3xl"></i></button>
            </div>
            <div id="auditList" class="flex-1 overflow-y-auto space-y-3"></div>
            <button class="w-full mt-6 bg-slate-900 text-white py-4 rounded-2xl font-bold" onclick="closeModal('modalAudit')">完成核准</button>
        </div>
    </div>

    <script>
        const $ = s => document.querySelector(s);
        let instructors = [
            { id: "P122355534", name: "楊東閔", unit: "大直分隊", certDate: "105-10", leadHours: 145, asstHours: 40, currentYear: 12, photo: "" },
            { id: "A127854094", name: "張浩哲", unit: "大直分隊", certDate: "110-06", leadHours: 20, asstHours: 55, currentYear: 4, photo: "" }
        ];
        let courses = [
            { id: 101, date: "115/01/19", time: "0800-0950", subject: "新式無線電操作訓練", role: "教官", req: 1, apps: [] },
            { id: 102, date: "115/01/19", time: "1400-1550", subject: "個人防護裝備及著裝", role: "教官", req: 1, apps: [] },
            { id: 103, date: "115/01/19", time: "1400-1550", subject: "個人防護裝備及著裝", role: "助教", req: 1, apps: [] }
        ];
        let supports = [];
        let currentBookingIns = null;

        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            $('#tab-' + tab).classList.add('active');
            $('#btn-' + tab).classList.add('active');
            $('#pageTitle').innerText = document.getElementById('btn-' + tab).innerText;
            if(tab === 'db') renderIns();
            if(tab === 'audit') renderAuditCourses();
        }

        // 渲染教官名片
        function renderIns() {
            const grid = $('#insGrid');
            grid.innerHTML = instructors.map(ins => {
                const img = ins.photo ? `<img src="${ins.photo}" class="w-full h-full object-cover">` : `<div class="w-full h-full flex items-center justify-center bg-slate-200 text-slate-400 font-bold text-2xl">${ins.name[0]}</div>`;
                return `
                <div class="bg-white rounded-3xl p-5 shadow-sm border border-slate-100 instructor-card">
                    <div class="flex gap-4 items-center mb-6">
                        <div class="w-16 h-16 rounded-2xl border border-slate-100 overflow-hidden shrink-0 shadow-sm">${img}</div>
                        <div>
                            <div class="text-[10px] font-bold text-orange-500">${ins.unit}</div>
                            <h3 class="text-lg font-bold text-slate-800">${ins.name}</h3>
                            <div class="text-[9px] text-slate-400">證照年月：${ins.certDate}</div>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-4 border-t pt-4">
                        <div class="text-center"><div class="text-xl font-bold text-blue-600">${ins.leadHours}</div><div class="text-[8px] text-slate-400 font-bold">教官時數</div></div>
                        <div class="text-center border-l"><div class="text-xl font-bold text-emerald-500">${ins.asstHours}</div><div class="text-[8px] text-slate-400 font-bold">助教時數</div></div>
                    </div>
                </div>`;
            }).join('');
        }

        // 報名邏輯 (ID驗證)
        function loginBooking() {
            const id = $('#loginId').value.trim();
            const ins = instructors.find(i => i.id === id);
            if(!ins) return alert("查無此身分證字號於師資庫中。");
            currentBookingIns = ins;
            $('#bookingLoginView').classList.add('hidden');
            $('#bookingArea').classList.remove('hidden');
            $('#welcomeMsg').innerText = `歡迎教官 ${ins.name}`;
            renderBookingList();
        }

        function logoutBooking() {
            currentBookingIns = null;
            $('#bookingLoginView').classList.remove('hidden');
            $('#bookingArea').classList.add('hidden');
            $('#loginId').value = "";
        }

        function renderBookingList() {
            const list = $('#bookingList');
            const grouped = courses.reduce((acc, c) => {
                if(!acc[c.date]) acc[c.date] = [];
                acc[c.date].push(c);
                return acc;
            }, {});

            list.innerHTML = Object.keys(grouped).map(date => `
                <div class="mb-4">
                    <div class="bg-slate-100 px-4 py-2 rounded-xl text-xs font-bold text-slate-500 mb-2">${date} 課程時段</div>
                    <div class="space-y-3">
                        ${grouped[date].map(c => {
                            const isApplied = c.apps.find(a => a.id === currentBookingIns.id);
                            return `
                            <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100 flex justify-between items-center">
                                <div>
                                    <div class="text-[10px] font-bold text-blue-600">${c.time}</div>
                                    <div class="font-bold text-sm">${c.subject}</div>
                                    <div class="text-[10px] bg-slate-200 px-1.5 rounded inline-block mt-1">需 ${c.role}</div>
                                </div>
                                <button onclick="applyCourse(${c.id})" class="px-4 py-1.5 ${isApplied?'bg-slate-300 text-slate-500':'bg-orange-500 text-white'} text-xs rounded-xl font-bold shadow-sm" ${isApplied?'disabled':''}>
                                    ${isApplied ? '已報名' : '立即報名'}
                                </button>
                            </div>`;
                        }).join('')}
                    </div>
                </div>
            `).join('');
        }

        function applyCourse(cid) {
            const course = courses.find(c => c.id === cid);
            course.apps.push({ id: currentBookingIns.id, time: new Date() });
            alert(`已完成報名：${course.subject} (${course.time})`);
            renderBookingList();
        }

        // 審核邏輯 (按日期與時段分組呈現)
        function renderAuditCourses() {
            const container = $('#auditCourseList');
            const grouped = courses.reduce((acc, c) => {
                if(!acc[c.date]) acc[c.date] = [];
                acc[c.date].push(c);
                return acc;
            }, {});

            container.innerHTML = Object.keys(grouped).map(date => `
                <div class="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">
                    <div class="bg-slate-50 p-4 font-bold text-sm border-b">${date} 課表清單</div>
                    <table class="w-full text-sm text-left">
                        <tbody class="divide-y divide-slate-100">
                            ${grouped[date].map(c => `
                                <tr>
                                    <td class="p-4"><div class="text-[10px] font-mono">${c.time}</div><div class="font-bold">${c.subject}</div></td>
                                    <td class="p-4 text-xs">需 ${c.role} ${c.req}名</td>
                                    <td class="p-4 text-xs text-orange-600 font-bold">${c.apps.length} 人報名</td>
                                    <td class="p-4 text-right"><button onclick="openAudit(${c.id})" class="bg-slate-900 text-white px-4 py-1.5 rounded-lg text-[10px] font-bold">進入審核</button></td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `).join('');
        }

        function openAudit(cid) {
            const course = courses.find(c => c.id === cid);
            $('#auditTitle').innerText = `${course.subject} (${course.time})`;
            const list = $('#auditList');
            openModal('modalAudit');

            // 排序邏輯：資歷(certDate越早) -> 公平(currentYear越小)
            const sorted = course.apps.map(a => {
                const ins = instructors.find(i => i.id === a.id);
                return { ...ins };
            }).sort((a, b) => {
                if(a.certDate !== b.certDate) return a.certDate > b.certDate ? 1 : -1;
                return a.currentYear - b.currentYear;
            });

            if(sorted.length === 0) { list.innerHTML = `<div class="p-10 text-center text-slate-300 italic">尚無教官報名此時段。</div>`; return; }

            list.innerHTML = sorted.map((ins, idx) => `
                <div class="flex items-center justify-between p-4 rounded-2xl border ${idx === 0 ? 'border-orange-200 bg-orange-50' : 'bg-white shadow-sm'}">
                    <div class="flex items-center gap-4">
                        <div class="w-8 h-8 rounded-full ${idx === 0 ? 'bg-orange-500 text-white' : 'bg-slate-100 text-slate-400'} flex items-center justify-center font-bold text-xs">${idx + 1}</div>
                        <div>
                            <div class="font-bold text-sm">${ins.name} <span class="text-[10px] font-normal opacity-50">(${ins.unit})</span></div>
                            <div class="text-[9px] font-bold text-blue-600 uppercase">證照：${ins.certDate} | 今年回饋：${ins.currentYear}hr</div>
                        </div>
                    </div>
                    <button class="bg-white border border-slate-200 px-4 py-1.5 rounded-xl text-[10px] font-bold hover:bg-orange-500 hover:text-white transition">核准錄用</button>
                </div>
            `).join('');
        }

        // CSV 功能
        function downloadInsSample() {
            const csv = "\uFEFF身分證字號,姓名,服務單位,取得師資證照年月(範例110-06),累計教官時數,累計助教時數\nP122355534,楊東閔,大直分隊,105-10,145,40";
            saveAs(new Blob([csv], { type: 'text/csv;charset=utf-8;' }), "師資庫匯入範本.csv");
        }
        function downloadCourseSample() {
            const csv = "\uFEFF日期,時間,科目,身分,需求人數\n115/01/19,0800-0950,新式無線電操作訓練,教官,1\n115/01/19,1400-1550,個人防護裝備,助教,1";
            saveAs(new Blob([csv], { type: 'text/csv;charset=utf-8;' }), "課表匯入範本.csv");
        }

        function importIns(input) {
            Papa.parse(input.files[0], { header:true, skipEmptyLines:true, complete: res => {
                instructors = res.data.map(r => ({
                    id: r["身分證字號"], name: r["姓名"], unit: r["服務單位"], certDate: r["取得師資證照年月(範例110-06)"],
                    leadHours: parseInt(r["累計教官時數"])||0, asstHours: parseInt(r["累計助教時數"])||0, currentYear: 0, photo: ""
                }));
                renderIns(); alert("師資母檔更新完成");
            }});
        }

        function importCourse(input) {
            Papa.parse(input.files[0], { header:true, skipEmptyLines:true, complete: res => {
                courses = res.data.map((r, i) => ({
                    id: i+1, date: r["日期"], time: r["時間"], subject: r["科目"], role: r["身分"], req: parseInt(r["需求人數"]), apps: []
                }));
                renderAuditCourses(); alert("課表時段匯入完成");
            }});
        }

        function applyPayroll(input) {
            $('#payrollName').innerText = input.files[0].name;
            Papa.parse(input.files[0], { header:true, skipEmptyLines:true, complete: res => {
                res.data.forEach(row => {
                    const ins = instructors.find(i => i.id === row["身分證字號"]);
                    if(ins) {
                        const amt = parseFloat(row["鐘點費(A)"]);
                        // 假設 1000/500 費率逆推
                        if(amt % 1000 === 0) { ins.leadHours += amt/1000; ins.currentYear += amt/1000; }
                        else { ins.asstHours += amt/500; ins.currentYear += amt/500; }
                    }
                });
                renderIns(); alert("回饋時數歸戶完成");
            }});
        }

        function importSupport(input) {
            Papa.parse(input.files[0], { header:true, skipEmptyLines:true, complete: res => {
                supports = res.data.map(r => ({ bat: r["大隊別"], name: r["姓名"], cat: r["類別"], period: r["姓名與時間"], months: r["支援期程(月)"] }));
                const body = $('#supportTableBody');
                body.innerHTML = supports.map(s => `<tr><td class="p-4">${s.bat}</td><td class="p-4 font-bold">${s.name}</td><td class="p-4">${s.cat}</td><td class="p-4 text-xs font-mono">${s.period}</td><td class="p-4 text-center text-orange-600 font-bold">${s.months}</td></tr>`).join('');
                alert("支援資歷檔案更新完成");
            }});
        }

        // 工具
        function preImg(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = e => { $('#prevPhoto').src = e.target.result; $('#prevPhoto').classList.remove('hidden'); }
                reader.readAsDataURL(input.files[0]);
            }
        }
        function saveIns() {
            instructors.push({
                id: $('#inId').value, name: $('#inName').value, unit: $('#inUnit').value, certDate: $('#inCertDate').value,
                leadHours: parseInt($('#inL').value)||0, asstHours: parseInt($('#inA').value)||0, currentYear: 0,
                photo: $('#prevPhoto').src.startsWith('data') ? $('#prevPhoto').src : ""
            });
            renderIns(); closeModal('modalAddIns');
        }
        function openModal(id) { $('#'+id).classList.add('active'); }
        function closeModal(id) { $('#'+id).classList.remove('active'); }
        function saveAs(blob, name) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); }

        renderIns();
    </script>
</body>
</html>
