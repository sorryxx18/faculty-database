<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>消防機關師資庫管理系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">

    <script>
        // ==========================================
        // ⚠️【請填入您的 Google Apps Script 網址】
        // 後端需配合調整以接收新的資料結構 (name, unit, rank, tags, etc.)
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzqBglqQq0srj4Wne5HsdMK1w0IbaT3DdhXPsjKUsSjkEOohGZslBVXnRyuGIZGp1YJ/exec"; 
        
        // 預設專長標籤 (用於下拉選單)
        const DEFAULT_TAGS = ["救助師資", "火搶教官", "急流教官", "山域搜救", "車禍救助", "EMT-P", "EMT-2", "空拍機"];
        // ==========================================
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
        body { font-family: 'Inter', 'Noto Sans TC', sans-serif; background-color: #f8fafc; }
        
        aside { transition: transform 0.3s ease-in-out; }
        .sidebar-open { transform: translateX(0); }
        .sidebar-closed { transform: translateX(-100%); }
        @media (min-width: 768px) { .sidebar-closed { transform: translateX(0); } }

        .sidebar-link { cursor: pointer; transition: all 0.2s; }
        .sidebar-link.active { background: rgba(59, 130, 246, 0.2); color: #93c5fd; border-left: 3px solid #60a5fa; }
        .sidebar-link:hover:not(.active) { background: #1e293b; color: white; }
        
        .table-wrapper { width: 100%; overflow-x: auto; background: white; border-radius: 8px; border: 1px solid #e2e8f0; }
        table { width: 100%; min-width: 1200px; border-collapse: collapse; table-layout: fixed; }
        th { background: #f1f5f9; color: #475569; font-weight: 700; padding: 12px; border: 1px solid #cbd5e1; font-size: 14px; position: sticky; top: 0; z-index: 10; text-align: left; }
        
        td { border: 1px solid #cbd5e1; padding: 6px; vertical-align: top; background: white; }
        input, select { width: 100%; height: 32px; border: 1px solid transparent; padding: 0 4px; outline: none; background: transparent; font-size: 14px; color: #1e293b; border-radius: 4px; }
        input:focus, select:focus { background: #eff6ff; border-color: #3b82f6; }
        
        .btn { padding: 8px 16px; border-radius: 6px; font-weight: 600; display: flex; align-items: center; gap: 6px; transition: 0.2s; font-size: 14px; cursor: pointer; }
        .btn-blue { background: #2563eb; color: white; } .btn-blue:hover { background: #1d4ed8; }
        .btn-white { background: white; border: 1px solid #cbd5e1; color: #475569; } .btn-white:hover { background: #f8fafc; border-color: #94a3b8; color: #2563eb; }
        
        /* Tags Style */
        .tag-pill { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; margin-right: 4px; margin-bottom: 2px; }
        .tag-red { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; } /* 火搶 */
        .tag-blue { background: #dbeafe; color: #1e40af; border: 1px solid #bfdbfe; } /* 急流 */
        .tag-green { background: #d1fae5; color: #065f46; border: 1px solid #a7f3d0; } /* 救助 */
        .tag-gray { background: #f3f4f6; color: #374151; border: 1px solid #e5e7eb; } /* 其他 */

        #loading { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 9999; display: none; justify-content: center; align-items: center; color: white; backdrop-filter: blur(2px); }
        .spinner { width: 40px; height: 40px; border: 4px solid #fff; border-top-color: #3b82f6; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-50 h-screen flex overflow-hidden">
    <div id="loading"><div class="spinner mb-4"></div><div class="font-bold text-lg" id="loadingText">資料處理中...</div></div>

    <!-- Sidebar -->
    <aside id="mainSidebar" class="w-64 bg-slate-900 text-white flex-col fixed inset-y-0 left-0 z-30 transform -translate-x-full md:relative md:translate-x-0 transition duration-200 ease-in-out shadow-2xl md:flex shrink-0">
        <div class="p-6 border-b border-slate-800 flex items-center justify-between gap-3">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center shadow-lg"><i class="ri-shield-user-line text-xl"></i></div>
                <div><h1 class="font-bold text-lg tracking-wide">師資管理系統</h1><p class="text-xs text-slate-400">Instructor DB</p></div>
            </div>
            <button onclick="toggleSidebar()" class="md:hidden text-slate-400 hover:text-white"><i class="ri-close-line text-2xl"></i></button>
        </div>
        
        <nav class="flex-1 p-4 space-y-2 overflow-y-auto">
            <div onclick="switchPage('input')" id="nav-input" class="sidebar-link active px-4 py-3 rounded-xl flex items-center gap-3 cursor-pointer">
                <i class="ri-user-add-line text-xl"></i> 
                <div><span class="block">名冊登錄</span><span class="text-[10px] opacity-60">新增或匯入師資</span></div>
            </div>
            <div onclick="switchPage('history')" id="nav-history" class="sidebar-link px-4 py-3 rounded-xl flex items-center gap-3 cursor-pointer">
                <i class="ri-contacts-book-2-line text-xl"></i> 
                <div><span class="block">師資總表</span><span class="text-[10px] opacity-60">查詢與編輯資料</span></div>
            </div>
            <div onclick="switchPage('gallery')" id="nav-gallery" class="sidebar-link px-4 py-3 rounded-xl flex items-center gap-3 cursor-pointer">
                <i class="ri-id-card-line text-xl text-yellow-400"></i> 
                <div><span class="block">師資名片牆</span><span class="text-[10px] opacity-60">可視化瀏覽</span></div>
            </div>
        </nav>
        <div class="p-4 border-t border-slate-800 text-center text-xs text-slate-500">
            Version 2.0 (Instructor Edition)
        </div>
    </aside>

    <div id="sidebarOverlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/50 z-20 hidden md:hidden"></div>

    <main class="flex-1 flex flex-col h-full overflow-hidden relative min-w-0">
        
        <!-- Mobile Header -->
        <header class="bg-white border-b border-slate-200 h-14 flex items-center justify-between px-4 md:hidden shrink-0 z-10">
            <div class="font-bold text-slate-700 flex items-center gap-2">
                <span class="w-6 h-6 bg-indigo-600 rounded flex items-center justify-center text-white"><i class="ri-shield-user-line"></i></span>
                師資管理
            </div>
            <button onclick="toggleSidebar()" class="p-2 text-slate-600 hover:bg-slate-100 rounded-lg">
                <i class="ri-menu-line text-xl"></i>
            </button>
        </header>

        <!-- INPUT PAGE: Roster Entry -->
        <div id="page-input" class="flex-1 flex flex-col p-6 overflow-y-auto h-full">
            <div class="bg-white border border-slate-200 border-l-4 border-l-indigo-600 rounded-xl p-5 shadow-sm flex flex-col flex-1">
                <div class="flex justify-between items-center mb-4 shrink-0 flex-wrap gap-2">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-indigo-100 rounded-lg flex items-center justify-center text-indigo-600">
                            <i class="ri-file-add-line text-xl"></i>
                        </div>
                        <div>
                            <h2 class="text-lg font-bold text-slate-800">名冊登錄區</h2>
                            <p class="text-xs text-slate-500">輸入師資基本資料、專長與證照資訊</p>
                        </div>
                    </div>
                    <div class="flex gap-2">
                        <button class="btn btn-white" onclick="downloadTemplate()"><i class="ri-file-download-line"></i> 下載範本</button>
                        <button class="btn btn-white" onclick="$('#csvInput').click()"><i class="ri-file-excel-2-line"></i> 匯入 CSV</button>
                        <button class="btn btn-blue shadow-lg shadow-indigo-200 bg-indigo-600 hover:bg-indigo-700" onclick="saveToCloud()"><i class="ri-save-3-line"></i> 儲存資料</button>
                    </div>
                </div>
                
                <div class="table-wrapper flex-1">
                    <table id="inputTable">
                        <thead>
                            <tr>
                                <th style="width:50px">刪</th>
                                <th style="width:50px">序</th>
                                <th style="width:120px">姓名</th>
                                <th style="width:140px">服務單位</th>
                                <th style="width:100px">職級</th>
                                <th style="width:200px">專長標籤 (逗號分隔)</th>
                                <th style="width:120px">證書字號</th>
                                <th style="width:250px">特殊經歷/備註</th>
                                <th style="width:120px">聯絡電話</th>
                            </tr>
                        </thead>
                        <tbody id="inputBody"></tbody>
                    </table>
                </div>
                <div class="mt-4 flex justify-center shrink-0">
                    <button class="btn btn-white w-full md:w-auto justify-center" onclick="addInputRow()">
                        <i class="ri-add-line"></i> 新增一列
                    </button>
                </div>
            </div>
        </div>
        
        <!-- HISTORY PAGE: Database -->
        <div id="page-history" class="hidden flex-col p-6 overflow-hidden h-full">
            <div class="flex justify-between items-center mb-4 shrink-0 flex-wrap gap-2">
                <div class="flex items-center gap-2"><span class="w-1 h-6 bg-emerald-600 rounded-full"></span><h2 class="text-xl font-bold text-slate-800">師資總表</h2></div>
                <div class="flex gap-2">
                    <button class="btn btn-white" onclick="loadHistory(true)"><i class="ri-refresh-line"></i> 重整</button>
                    <button class="btn btn-white" onclick="exportExcel()"><i class="ri-download-2-line"></i> 匯出報表</button>
                </div>
            </div>

            <!-- Filter Bar -->
            <div class="bg-white p-3 rounded-xl border border-slate-200 mb-4 flex gap-3 shadow-sm items-center flex-wrap">
                <div class="flex items-center text-slate-500 text-sm gap-2"><i class="ri-filter-3-line"></i> 篩選：</div>
                <input type="text" id="filterText" onkeyup="filterHistory()" placeholder="搜尋姓名或單位..." class="border border-slate-300 rounded px-3 py-1 text-sm w-48">
                <select id="filterTag" onchange="filterHistory()" class="border border-slate-300 rounded px-3 py-1 text-sm w-40 bg-white">
                    <option value="">所有專長</option>
                    <!-- Options populated by JS -->
                </select>
                <div class="ml-auto text-xs text-slate-400">共 <span id="totalCount" class="font-bold text-slate-800">0</span> 筆資料</div>
            </div>

            <div class="table-wrapper flex-1 min-h-0 overflow-auto bg-white border border-slate-200 rounded-lg shadow-sm mb-0">
                <table id="historyTable">
                    <thead>
                        <tr>
                            <th style="width:60px">項次</th>
                            <th style="width:100px">姓名</th>
                            <th style="width:120px">單位</th>
                            <th style="width:80px">職級</th>
                            <th style="width:250px">專長/證照</th>
                            <th style="width:150px">證號/期別</th>
                            <th style="width:200px">經歷/備註</th>
                            <th style="width:120px">電話</th>
                            <th style="width:100px">照片/檔案</th>
                        </tr>
                    </thead>
                    <tbody id="historyBody"></tbody>
                </table>
            </div>
            
            <!-- Pagination -->
            <div class="h-[60px] flex items-center justify-between border-t border-slate-200 pt-3 mt-2 shrink-0 bg-slate-50 px-4">
                <div class="text-sm text-slate-500">顯示第 <span id="pageInfoStart" class="font-bold">0</span> - <span id="pageInfoEnd" class="font-bold">0</span> 筆</div>
                <div class="flex gap-2">
                    <button onclick="changePage(-1)" id="prevBtn" class="px-3 py-1 border rounded bg-white hover:bg-slate-50 text-sm">上一頁</button>
                    <button onclick="changePage(1)" id="nextBtn" class="px-3 py-1 border rounded bg-white hover:bg-slate-50 text-sm">下一頁</button>
                </div>
            </div>
        </div>

        <!-- GALLERY PAGE: Cards -->
        <div id="page-gallery" class="hidden flex-1 flex-col p-6 overflow-hidden h-full bg-slate-100">
            <div class="flex justify-between items-center mb-6 shrink-0 flex-wrap gap-3">
                <div class="flex items-center gap-2">
                    <span class="w-1 h-6 bg-yellow-400 rounded-full"></span>
                    <h2 class="text-xl font-bold text-slate-800">師資名片牆</h2>
                </div>
                <div class="flex bg-white p-1 rounded-xl border border-slate-200 shadow-sm flex-1 max-w-md">
                    <div class="pl-3 flex items-center text-slate-400"><i class="ri-search-line"></i></div>
                    <input type="text" id="gallerySearchInput" onkeyup="renderGallery()" placeholder="搜尋姓名、專長..." class="w-full border-none outline-none bg-transparent px-2 text-sm font-bold text-slate-700 h-9">
                </div>
            </div>
            
            <div class="flex-1 overflow-y-auto min-h-0 pr-2 pb-10" id="galleryContainer">
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6" id="galleryGrid"></div>
            </div>
        </div>
    </main>

    <input type="file" id="csvInput" accept=".csv" style="display:none" onchange="processCSV(this)">
    <input type="file" id="photoInput" accept="image/*" style="display:none" onchange="handlePhotoUpload(this)">

    <script>
        const $ = (s) => document.querySelector(s);
        let inputData = []; 
        let historyData = []; 
        let filteredData = [];
        let uploadTarget = null;
        let currentPage = 1;
        const itemsPerPage = 20;

        window.onload = function() { 
            addInputRow(); 
            loadHistory(true);
            populateTagFilter();
        };

        function populateTagFilter() {
            const sel = $('#filterTag');
            DEFAULT_TAGS.forEach(tag => {
                const opt = document.createElement('option');
                opt.value = tag;
                opt.innerText = tag;
                sel.appendChild(opt);
            });
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('mainSidebar');
            const overlay = document.getElementById('sidebarOverlay');
            if (sidebar.classList.contains('-translate-x-full')) {
                sidebar.classList.remove('-translate-x-full'); 
                overlay.classList.remove('hidden');
            } else {
                sidebar.classList.add('-translate-x-full'); 
                overlay.classList.add('hidden');
            }
        }

        function switchPage(page) {
            document.querySelectorAll('.sidebar-link').forEach(el => el.classList.remove('active'));
            if(document.getElementById(`nav-${page}`)) document.getElementById(`nav-${page}`).classList.add('active');
            
            $('#page-input').classList.add('hidden'); 
            $('#page-history').classList.add('hidden'); $('#page-history').classList.remove('flex');
            $('#page-gallery').classList.add('hidden'); $('#page-gallery').classList.remove('flex');
            
            const target = $(`#page-${page}`);
            target.classList.remove('hidden');
            
            if(page === 'history' || page === 'gallery') {
                target.classList.add('flex');
                if(page === 'gallery') renderGallery();
                if(page === 'history') renderHistoryTable();
            }
        }

        // ==========================================
        //  INPUT LOGIC (Roster)
        // ==========================================
        function addInputRow(data={}) {
            inputData.push({ 
                name: data.name||'', 
                unit: data.unit||'', 
                rank: data.rank||'', 
                tags: data.tags||'', 
                license: data.license||'', 
                note: data.note||'',
                phone: data.phone||''
            });
            renderInputTable();
        }

        function removeInputRow(idx) {
            if (inputData.length > 1) inputData.splice(idx, 1); 
            else inputData[0] = {name:'', unit:'', rank:'', tags:'', license:'', note:'', phone:''};
            renderInputTable();
        }

        function renderInputTable() {
            const tbody = $('#inputBody'); tbody.innerHTML = '';
            inputData.forEach((row, i) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="text-center align-middle"><button onclick="removeInputRow(${i})" class="text-slate-300 hover:text-red-500"><i class="ri-close-circle-fill text-xl"></i></button></td>
                    <td class="text-center text-slate-400 font-mono align-middle">${i + 1}</td>
                    <td><input type="text" value="${row.name}" onchange="inputData[${i}].name=this.value" placeholder="姓名"></td>
                    <td><input type="text" value="${row.unit}" onchange="inputData[${i}].unit=this.value" placeholder="如：信義分隊"></td>
                    <td><input type="text" value="${row.rank}" onchange="inputData[${i}].rank=this.value" placeholder="如：隊員"></td>
                    <td><input type="text" value="${row.tags}" onchange="inputData[${i}].tags=this.value" placeholder="救助師資, 火搶..."></td>
                    <td><input type="text" value="${row.license}" onchange="inputData[${i}].license=this.value" placeholder="證書編號"></td>
                    <td><input type="text" value="${row.note}" onchange="inputData[${i}].note=this.value" placeholder="特殊經歷"></td>
                    <td><input type="text" value="${row.phone}" onchange="inputData[${i}].phone=this.value" placeholder="09xx..."></td>`;
                tbody.appendChild(tr);
            });
        }

        function downloadTemplate() {
            const csv = "\uFEFF姓名,服務單位,職級,專長標籤,證書字號,備註(經歷),聯絡電話\n王小明,信義分隊,隊員,救助師資、急流R1,消署訓字第123號,112年土耳其救援,0912345678";
            saveAs(new Blob([csv], { type: 'text/csv;charset=utf-8;' }), "師資庫匯入範本.csv");
        }

        function processCSV(input) {
            if (!input.files[0]) return;
            Papa.parse(input.files[0], { 
                header: true, 
                skipEmptyLines: true, 
                complete: function (res) {
                    const imp = res.data; let count = 0;
                    imp.forEach(r => {
                        // Smart mapping for various CSV headers based on user files
                        const get = (keys) => { for(let k of Object.keys(r)) if(keys.some(key=>k.includes(key))) return r[k]; return ''; };
                        
                        const name = get(['姓名', 'Name']);
                        if(!name || name.includes('範例')) return;

                        inputData.push({ 
                            name: name, 
                            unit: get(['單位', 'Unit', '機關']), 
                            rank: get(['職', 'Rank', '官等']), 
                            tags: get(['專長', 'Tag', '項目', '證照']), 
                            license: get(['證書', '字號', '期別']), 
                            note: get(['備註', '經歷', 'Note']), 
                            phone: get(['電話', '手機', 'Phone']) 
                        });
                        count++;
                    });
                    renderInputTable(); alert(`已匯入 ${count} 筆資料`); input.value = '';
                }
            });
        }

        // ==========================================
        //  BACKEND LOGIC
        // ==========================================
        function showLoading(msg) { $('#loadingText').innerText = msg; $('#loading').style.display = 'flex'; }
        function hideLoading() { $('#loading').style.display = 'none'; }

        function saveToCloud() {
            const validData = inputData.filter(r => r.name && r.unit);
            if (validData.length === 0) return alert('請至少填寫姓名與單位');
            
            showLoading("資料儲存中...");
            fetch(GAS_API_URL, { 
                method: 'POST', 
                body: JSON.stringify({ mode: 'append_instructor', data: validData }), // Backend needs to handle this mode
                headers: { 'Content-Type': 'text/plain' } 
            })
            .then(res => res.json())
            .then(json => {
                if (json.status === 'success') { 
                    alert('儲存成功！'); 
                    inputData=[{name:'', unit:'', rank:'', tags:'', license:'', note:'', phone:''}]; 
                    addInputRow(); 
                    loadHistory(true); 
                } else alert('儲存失敗: ' + json.message);
            })
            .catch((err)=>{ console.error(err); alert('連線錯誤，請檢查網路或 Script URL'); })
            .finally(() => hideLoading());
        }

        function loadHistory(refresh = false) {
            if(refresh) showLoading("同步資料庫...");
            
            // Mock Data for demonstration if API is not set
            if(GAS_API_URL.includes("請填入")) {
                setTimeout(() => {
                    historyData = [
                        {name: "林政憲", unit: "石牌分隊", rank: "小隊長", tags: "急流教官,救助師資", license: "消署訓字第0A380025號", note: "112年土耳其救援", phone: "0975-537027", photoUrl: ""},
                        {name: "張浩哲", unit: "大直分隊", rank: "隊員", tags: "救助師資, 車禍救助", license: "第22期救助師資", note: "104年復興空難搜救", phone: "0921-123456", photoUrl: ""},
                        {name: "王崇瑋", unit: "大直分隊", rank: "隊員", tags: "EMT-P, 激流R2", license: "消署訓字第3A511061號", note: "", phone: "0927-081-879", photoUrl: ""}
                    ];
                    filterHistory();
                    hideLoading();
                }, 500);
                return;
            }

            fetch(GAS_API_URL + "?mode=get_instructors") // Backend needs to handle 'get_instructors'
            .then(r => r.json())
            .then(json => {
                if (json.status === 'success') {
                    historyData = json.data;
                    filterHistory();
                }
            })
            .finally(() => hideLoading());
        }

        // ==========================================
        //  DISPLAY LOGIC (Table & Gallery)
        // ==========================================
        
        function getTagHtml(tagsStr) {
            if(!tagsStr) return '';
            return tagsStr.split(/[,，、]/).map(t => {
                t = t.trim();
                let colorClass = 'tag-gray';
                if(t.includes('火搶') || t.includes('火災')) colorClass = 'tag-red';
                if(t.includes('急流') || t.includes('水域')) colorClass = 'tag-blue';
                if(t.includes('救助')) colorClass = 'tag-green';
                return `<span class="tag-pill ${colorClass}">${t}</span>`;
            }).join('');
        }

        function filterHistory() {
            const txt = $('#filterText').value.toLowerCase();
            const tag = $('#filterTag').value;
            
            filteredData = historyData.filter(r => {
                const matchText = (r.name+r.unit+r.note).toLowerCase().includes(txt);
                const matchTag = tag ? (r.tags || '').includes(tag) : true;
                return matchText && matchTag;
            });
            
            $('#totalCount').innerText = filteredData.length;
            currentPage = 1;
            renderHistoryTable();
            renderGallery(); // Also update gallery when filter changes
        }

        function changePage(delta) {
            const maxPage = Math.ceil(filteredData.length / itemsPerPage) || 1;
            currentPage += delta;
            if(currentPage < 1) currentPage = 1;
            if(currentPage > maxPage) currentPage = maxPage;
            renderHistoryTable();
        }

        function renderHistoryTable() {
            const tbody = $('#historyBody'); tbody.innerHTML = '';
            const startIdx = (currentPage - 1) * itemsPerPage;
            const endIdx = startIdx + itemsPerPage;
            const pageData = filteredData.slice(startIdx, endIdx);

            pageData.forEach((row, i) => {
                const tr = document.createElement('tr');
                tr.className = i % 2 === 0 ? 'bg-white' : 'bg-slate-50';
                
                const photoBtn = row.photoUrl 
                    ? `<a href="${row.photoUrl}" target="_blank" class="text-blue-600 hover:underline text-xs"><i class="ri-image-line"></i> 查看</a>` 
                    : `<button onclick="triggerUpload('${row.name}')" class="text-slate-400 hover:text-blue-500 text-xs"><i class="ri-upload-cloud-line"></i> 上傳</button>`;

                tr.innerHTML = `
                    <td class="text-center text-slate-500 font-mono text-xs">${startIdx + i + 1}</td>
                    <td class="px-2 font-bold text-slate-700">${row.name}</td>
                    <td class="px-2 text-sm">${row.unit}</td>
                    <td class="px-2 text-sm">${row.rank}</td>
                    <td class="px-2">${getTagHtml(row.tags)}</td>
                    <td class="px-2 text-xs text-slate-500 font-mono">${row.license}</td>
                    <td class="px-2 text-xs text-slate-500">${row.note}</td>
                    <td class="px-2 text-xs font-mono">${row.phone}</td>
                    <td class="text-center">${photoBtn}</td>`;
                tbody.appendChild(tr);
            });

            $('#pageInfoStart').innerText = filteredData.length > 0 ? startIdx + 1 : 0;
            $('#pageInfoEnd').innerText = Math.min(endIdx, filteredData.length);
            
            $('#prevBtn').disabled = currentPage === 1;
            $('#nextBtn').disabled = currentPage >= Math.ceil(filteredData.length / itemsPerPage);
        }

        function renderGallery() {
            const container = $('#galleryGrid');
            const term = $('#gallerySearchInput').value.toLowerCase();
            
            // Re-filter specifically for gallery search box, or use global filteredData
            let displayList = filteredData;
            if(term) {
                displayList = filteredData.filter(r => (r.name+r.tags).toLowerCase().includes(term));
            }

            container.innerHTML = '';
            if (displayList.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center text-slate-400 py-10">無符合師資</div>`;
                return;
            }

            displayList.forEach(item => {
                // Generate Avatar Initials if no photo
                const avatar = item.photoUrl 
                    ? `<img src="${item.photoUrl}" class="w-full h-full object-cover">`
                    : `<div class="w-full h-full bg-slate-200 flex items-center justify-center text-slate-400 text-4xl font-bold">${item.name[0]}</div>`;

                const card = document.createElement('div');
                card.className = 'bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col hover:shadow-md transition duration-200';
                card.innerHTML = `
                    <div class="h-24 bg-gradient-to-r from-blue-500 to-indigo-600 relative">
                        <div class="absolute -bottom-8 left-4 w-16 h-16 rounded-full border-4 border-white overflow-hidden bg-white shadow-md">
                            ${avatar}
                        </div>
                    </div>
                    <div class="pt-10 px-4 pb-4 flex-1 flex flex-col">
                        <div class="flex justify-between items-start">
                            <div>
                                <h3 class="font-bold text-lg text-slate-800">${item.name}</h3>
                                <p class="text-xs text-slate-500">${item.unit} | ${item.rank}</p>
                            </div>
                            <div class="text-right">
                                ${item.phone ? `<a href="tel:${item.phone}" class="text-indigo-500 hover:bg-indigo-50 p-1 rounded"><i class="ri-phone-fill"></i></a>` : ''}
                            </div>
                        </div>
                        <div class="mt-3 mb-2 flex flex-wrap">
                            ${getTagHtml(item.tags)}
                        </div>
                        <div class="mt-auto pt-3 border-t border-slate-100 text-xs text-slate-400">
                            <i class="ri-medal-line"></i> ${item.license || '無證號資料'}
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // ==========================================
        //  UTILITIES
        // ==========================================
        function triggerUpload(name) {
            uploadTarget = name; // Just storing name to simulate linking
            $('#photoInput').click();
        }

        function handlePhotoUpload(input) {
            if(input.files && input.files[0]) {
                alert(`模擬上傳成功！照片將連結至：${uploadTarget}`);
                // In real GAS implementation, you'd convert to Base64 and send to API
                input.value = '';
            }
        }

        async function exportExcel() {
            const wb = new ExcelJS.Workbook();
            const ws = wb.addWorksheet('師資清冊');
            ws.columns = [
                {header:'姓名', key:'name', width:15},
                {header:'單位', key:'unit', width:20},
                {header:'職級', key:'rank', width:10},
                {header:'專長標籤', key:'tags', width:30},
                {header:'證號', key:'license', width:25},
                {header:'電話', key:'phone', width:15},
                {header:'備註', key:'note', width:30}
            ];
            
            // Header Style
            ws.getRow(1).eachCell(c => {
                c.fill = {type:'pattern', pattern:'solid', fgColor:{argb:'FF4F46E5'}}; // Indigo
                c.font = {bold:true, color:{argb:'FFFFFFFF'}};
            });

            filteredData.forEach(r => ws.addRow(r));
            
            const buf = await wb.xlsx.writeBuffer();
            saveAs(new Blob([buf]), '消防師資資料庫.xlsx');
        }
    </script>
</body>
</html>
